# Reusable workflow: validates with the exact script the skill runs locally.
# Caller:
#   jobs:
#     validate:
#       uses: AustinRP2008/platform-skills/.github/workflows/reusable-prometheus-rules.yml@<sha>
#       with: {path: <dir>}
name: reusable-prometheus-rules
on:
  workflow_call:
    inputs:
      path:
        description: Monitoring directory containing rules/ and tests/
        type: string
        required: true
      platform-ref:
        description: platform-skills ref to take scripts and tool versions from (pin a tag or SHA)
        type: string
        default: main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AustinRP2008/platform-skills
          ref: ${{ inputs.platform-ref }}
          path: .platform
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: {working_directory: .platform}
      - name: validate
        env:
          TARGET: ${{ inputs.path }}
        run: mise exec -C "$GITHUB_WORKSPACE/.platform" -- "$GITHUB_WORKSPACE/.platform/plugins/observability/skills/adding-prometheus-alert/scripts/validate.sh" "$GITHUB_WORKSPACE/$TARGET"
