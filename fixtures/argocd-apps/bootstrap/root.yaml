# App of apps: syncs the AppProject and every ApplicationSet in addons/ (not addons/values/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-addons
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:AustinRP2008/argocd-apps.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: "{bootstrap/project.yaml,addons/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
