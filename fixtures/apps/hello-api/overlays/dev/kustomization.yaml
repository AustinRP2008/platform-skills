apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-api-dev
resources: [../../base]
labels:
  - pairs: {environment: dev}
patches:
  - target: {kind: HorizontalPodAutoscaler, name: hello-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
